<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Flashcards Generator | StudyGen AI</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold"
                href="dashboard.html">

                StudyGen AI

            </a>

        </div>

    </nav>


    <!-- Flashcards Section -->

    <div class="container mt-5">

        <div class="card shadow p-5">

            <h1 class="text-center mb-4">

                AI Flashcards Generator

            </h1>

            <p class="text-center">

                Generate smart flashcards from your study materials for quick revision.

            </p>

            <br>


            <!-- Number of Flashcards -->

            <label class="form-label">

                Number of Flashcards

            </label>

            <select  id="flashcardCount">

                <option value="5">5 Flashcards</option>
    <option value="10">10 Flashcards</option>
    <option value="15">15 Flashcards</option>
    <option value="20">20 Flashcards</option>
            </select>

            <br>


            <!-- Generate Button -->

            <div class="text-center">

<button class="btn btn-primary" onclick="generateFlashcards()">

Generate Flashcards

</button>

</div>

            <br><br>


            <!-- Flashcard Output -->

            <h5>

                Generated Flashcards

            </h5>

            <div id="flashcardOutput" class="p-4">

                Flashcards will appear here.

            </div>

            <br>


            <!-- Navigation Buttons -->

            <div class="text-center">

<button class="btn btn-primary me-3"  onclick="previousCard()">

Previous Card

</button>


<button class="btn btn-success" onclick="nextCard()">

Next Card

</button>

<a href="quiz.html"
   class="btn btn-warning ms-3">
    Generate Quiz
</a>

<br>

</div>

            <!-- Back Button -->

            <div class="text-center mt-4">

<a href="dashboard.html"
class="btn btn-secondary">

Back to Dashboard

</a>

</div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->

    <script src="script.js"></script>

</body>

</html>

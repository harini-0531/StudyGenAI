<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Study Planner | StudyGen AI</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold"
                href="dashboard.html">

                StudyGen AI

            </a>

        </div>

    </nav>


    <!-- Study Planner Section -->

    <div class="container mt-5">

        <div class="card shadow p-5">

            <h1 class="text-center mb-4">

                AI Study Planner

            </h1>

            <p class="text-center">

                Generate a personalized study schedule based on your subjects and available study time.

            </p>

            <br>


            <!-- Subjects -->

            <label class="form-label">

                Enter Your Subjects

            </label>

            <input type="text"
                   id="subjects"
                class="form-control"
                placeholder="Example: Java, DBMS, Operating Systems">

            <br>


            <!-- Study Hours -->

            <label class="form-label">

                Study Hours Per Day

            </label>

            <input type="number"
                   id="studyHours"
                class="form-control"
                placeholder="Example: 4">

            <br>


            <!-- Exam Date -->

            <label class="form-label">

                Upcoming Exam Date

            </label>

            <input type="date"
                   id="examDate"
                class="form-control">

            <br>


            <!-- Preferred Study Time -->

            <label class="form-label">

                Preferred Study Time

            </label>

            <select id="preferredTime" class="form-select">

                <option value="Morning">Morning</option>
<option value="Afternoon">Afternoon</option>
<option value="Evening">Evening</option>
<option value="Night">Night</option>

            </select>

            <br>


            <!-- Generate Study Plan -->

            <div class="text-center">

<button class="btn btn-primary"  onclick="generateStudyPlan()">

Generate Study Plan

</button>

</div>


            <!-- Study Plan Output -->

            <h5>

                Personalized Study Plan

            </h5>

            <div id="plannerOutput" class="border rounded p-4">

                Your AI-generated study schedule will appear here.

            </div>

            <br>


            <!-- Download Button -->

            <div class="text-center">

<button class="btn btn-success" onclick="downloadStudyPlan()">

Download Study Plan

</button>

<a href="chat.html"
   class="btn btn-warning">
    Open AI Tutor
</a>
<br>

</div>

            <!-- Back Button -->

            <div class="text-center mt-4">

<a href="dashboard.html"
class="btn btn-secondary">

Back to Dashboard

</a>

</div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->

    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>

</html>

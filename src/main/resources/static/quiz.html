<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AI Quiz Generator | StudyGen AI</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold"
                href="dashboard.html">

                StudyGen AI

            </a>

        </div>

    </nav>


    <!-- Quiz Generator Section -->

    <div class="container mt-5 mb-5">

        <div class="card shadow p-5">

            <!-- Heading -->

            <h1 class="text-center mb-3">

                AI Quiz Generator

            </h1>

            <p class="text-center mb-5">

                Generate multiple choice questions from your uploaded study notes.

            </p>


            <!-- Number of Questions -->

            <label class="form-label">

                Number of Questions

            </label>

            <select class="form-select" id="questionCount">

    <option value="5">5 Questions</option>
    <option value="10">10 Questions</option>

</select>
            <br>


            <!-- Difficulty Level -->

            <label id="difficulty" class="form-label">

                Difficulty Level

            </label>
<select class="form-select" id="difficulty">

    <option value="Easy">Easy</option>
    <option value="Medium">Medium</option>
    <option value="Hard">Hard</option>

</select>

            <br>


            <!-- Generate Quiz Button -->

            <div class="text-center">

                <button class="btn btn-primary px-5" onclick="generateQuiz()">

                    Generate Quiz

                </button>

            </div>

            <br><br>


            <!-- Quiz Output Section -->

            <h4>

                Generated Quiz

            </h4>

            <div id="quizOutput" class="border rounded p-4">

                <p>

                    MCQ questions will appear here after generating the quiz.

                </p>

            </div>
            <br>

<div id="scoreOutput"
     class="alert alert-info">

    Score will appear here.

</div>


            <!-- Submit Quiz & View Score -->

            <div class="text-center mt-4">

                <button class="btn btn-primary me-3"  onclick="submitQuiz()">

                    Submit Quiz

                </button>

                <button class="btn btn-success " onclick="viewScore()">

                    View Score

                </button>

                <a href="planner.html"
   class="btn btn-warning ms-3">
    Create Study Plan
</a>

            </div>


            <!-- Back to Dashboard -->

            <div class="text-center mt-4">

                <a href="dashboard.html"
                    class="btn btn-secondary">

                    Back to Dashboard

                </a>

            </div>

        </div>

    </div>



    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



    <!-- Custom JS -->

    <script src="script.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Tutor Chat | StudyGen AI</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold"
                href="dashboard.html">

                StudyGen AI

            </a>

        </div>

    </nav>


    <!-- AI Tutor Chat Section -->

    <div class="container mt-5">

        <div class="card shadow p-5">

            <h1 class="text-center mb-4">

                AI Tutor Chat

            </h1>

            <p class="text-center">

                Ask questions related to your study materials.

            </p>

            <br>

            <!-- Question Box -->

            <label class="form-label">

                Ask Your Question

            </label>

            <textarea id="questionInput"
            class="form-control"
                rows="5"
                placeholder="Example: Explain Artificial Intelligence in simple terms.">

            </textarea>

            <br>

            

            <!-- Buttons -->

<div class="text-center">

    <button class="btn btn-success me-3" onclick="askAI()">

        Ask AI

    </button>

    <button class="btn btn-danger" onclick="clearChat()">

        Clear Chat

    </button>

</div>

            <!-- AI Response Area -->

            <h5>

                AI Response

            </h5>

            <div class="border rounded p-3" id="chatOutput">

                The AI response will be displayed here.

            </div>

            <br>

            <!-- Back Button -->

           <div class="text-center mt-4">

<a href="dashboard.html"
class="btn btn-secondary">

Back to Dashboard

</a>

</div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->

    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Summary Generator | StudyGen AI</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold"
                href="dashboard.html">

                StudyGen AI

            </a>

        </div>

    </nav>


    <!-- Summary Generator Section -->

    <div class="container mt-5">

        <div class="card shadow p-5">

            <h1 class="text-center mb-4">

                AI Summary Generator

            </h1>

            <p class="text-center">

                Generate concise and easy-to-understand summaries from your study materials.

            </p>

            <br>

            <!-- Summary Length -->

            <label class="form-label" for="summaryType">

                Select Summary Type

            </label>

            <select id="summaryType" class="form-select">

                 <option value="Short">Short Summary</option>
                 <option value="Medium">Medium Summary</option>
                 <option value="Detailed">Detailed Summary</option>

            </select>

            <br>

            <!-- Generate Button -->
            <div class="text-center">
            <button class="btn btn-primary me-3" onclick="generateSummary()">

                Generate Summary

            </button>
            </div>

            <br><br>

            <!-- Summary Output -->

            <h5>

                Generated Summary

            </h5>

            <div id="summaryOutput" class="border rounded p-4">

                Your AI-generated summary will be displayed here.

            </div>

            <br>

            <!-- Download Button -->

            <div class="text-center">

    <button class="btn btn-success" onclick="downloadSummary()">
        Download Summary
    </button>

<a href="flashcards.html"
   class="btn btn-warning">
    Generate Flashcards
</a>
    <div class="text-center mt-4">

<a href="dashboard.html"
class="btn btn-secondary">

Back to Dashboard

</a>

</div>

</div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->

    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>

</html>
